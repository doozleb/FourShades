name: ci

on:
  push:
  pull_request:

jobs:
  build-and-score:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Puts MSVC, and Visual Studio's bundled CMake and Ninja, on PATH.
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # SDL3 is vendored, gitignored and never committed, and CMakeLists.txt
      # fails configure outright without it, so this has to come first.
      - name: Fetch SDL3 (pinned, hash-checked)
        run: python third_party/sdl/fetch_sdl.py

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      # The window is part of the default target, so the step above already
      # builds it -- but nothing said so, and nothing noticed if it stopped.
      # This names the target and checks what it produced. It is never run:
      # the runner has no display, and an SDL window cannot open on it.
      - name: The app builds
        run: |
          cmake --build --preset release --target fourshades_app
          if (-not (Test-Path build\release\app\fourshades_app.exe)) {
            throw "fourshades_app.exe was not produced"
          }
          if (-not (Test-Path build\release\app\SDL3.dll)) {
            throw "SDL3.dll was not copied next to fourshades_app.exe"
          }

      - name: Unit tests
        run: ctest --preset release

      - name: Scoreboard script tests
        run: python -m unittest discover -s tools -p "test_*.py"

      - name: Core isolation
        run: python tools/check_core_isolation.py

      - uses: actions/cache@v4
        with:
          path: tools/sst/data
          key: sst-f9c30210245dd691661db39f5ace022c465ecc2f

      - name: Fetch SingleStepTests (pinned, hash-checked)
        run: python tools/sst/fetch_sst.py

      - name: Run SingleStepTests
        run: .\build\release\tools\sst\sst_runner.exe

      - uses: actions/cache@v4
        with:
          path: tools/roms/data
          key: roms-38b926bdbc26993d1b4c43e97979ecc66287bf02

      # tests.json must be exactly what the Shootout's own definitions give at
      # the pinned commit. The token only lifts the GitHub API's rate limit.
      - name: Test list matches the Shootout
        run: python tools/roms/make_test_list.py --check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch test ROMs (pinned, hash-checked)
        run: python tools/roms/fetch_roms.py

      - name: Run test ROMs
        run: .\build\release\tools\roms\rom_runner.exe

      - name: Scoreboard matches the runs
        run: python tools/scoreboard.py check build/sst-results.json build/rom-results.json

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            build/sst-results.json
            build/rom-results.json
          if-no-files-found: error
